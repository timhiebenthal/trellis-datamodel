name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync --dev --extra dbt-example

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps

      - name: Run Python tests
        run: uv run pytest

      - name: Run frontend unit tests
        run: cd frontend && npm run test:unit

      # dbt_company_dummy/target/ is gitignored; Playwright tests need both manifest + catalog.
      # Pass data_path as an absolute path so DuckDB finds the CSV files regardless of cwd.
      # dbt run materializes models into DuckDB (required for catalog column introspection).
      # dbt docs generate then writes manifest.json + catalog.json with actual column types.
      - name: Generate dbt artifacts for company dummy (E2E tests)
        run: |
          DATA_PATH="$(pwd)/dbt_company_dummy/data"
          uvx --from dbt-duckdb dbt run --project-dir dbt_company_dummy --profiles-dir dbt_company_dummy --vars "data_path: $DATA_PATH"
          uvx --from dbt-duckdb dbt docs generate --project-dir dbt_company_dummy --profiles-dir dbt_company_dummy --vars "data_path: $DATA_PATH"

      - name: Run frontend e2e tests
        run: cd frontend && npm run test:e2e

      - name: Build static files
        run: |
          cd frontend
          npm run build
          rm -rf ../trellis_datamodel/static/*
          cp -r build/* ../trellis_datamodel/static/
